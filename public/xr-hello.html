<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>XR Hello</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 16px; background: #111; color: #eee; font: 14px/1.5 system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 0 0 12px; opacity: 0.75; max-width: 70ch; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  button { font: inherit; padding: 8px 16px; border-radius: 10px; border: 2px solid #eee; background: #222; color: #eee; cursor: pointer; }
  button.primary { background: #eee; color: #111; }
  button:disabled { opacity: 0.4; cursor: default; }
  #status { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
  #log { margin: 0; padding: 12px; border-radius: 10px; background: #000; font: 13px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; max-height: 60vh; overflow: auto; }
  .ok { color: #9f9; } .wait { color: #fd6; } .err { color: #f88; }
</style>
</head>
<body>
<h1>XR hello world</h1>
<p>
  The smallest possible WebXR session: no three.js, no Spark, no splats. In VR the
  headset should show a solid colour that slowly cycles. Every step is timed below,
  so if something hangs you can see exactly which one.
</p>
<div class="bar">
  <button id="start" class="primary" disabled>Start XR (classic layer)</button>
  <button id="startProj" disabled>Start XR (projection layer, like three.js)</button>
  <button id="end" hidden>End XR</button>
  <button id="reload">Reload page</button>
</div>
<div id="status">Checking…</div>
<pre id="log"></pre>

<script>
  const $ = (id) => document.getElementById(id);
  const logEl = $("log"), statusEl = $("status"), endBtn = $("end");
  const startBtns = [$("start"), $("startProj")];
  // One object so both buttons can be enabled/disabled together.
  const startBtn = {
    set disabled(v) { for (const b of startBtns) b.disabled = v; },
  };
  const t0 = performance.now();
  const stamp = () => `${((performance.now() - t0) / 1000).toFixed(2).padStart(7)} s`;

  function log(msg, cls = "") {
    const line = document.createElement("span");
    line.className = cls;
    line.textContent = `${stamp()}  ${msg}\n`;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
    console.log(`[xr-hello] ${msg}`);
  }
  function status(msg, cls = "") {
    statusEl.textContent = msg;
    statusEl.className = cls;
  }

  /** Awaits `promise`, logging the step, a "still waiting" line every 5 s, and how long it took. */
  async function step(name, promise) {
    log(`→ ${name}…`);
    const started = performance.now();
    const timer = setInterval(() => {
      const s = Math.round((performance.now() - started) / 1000);
      log(`  still waiting on ${name} (${s} s)`, "wait");
      status(`Stuck on: ${name} (${s} s)`, "wait");
    }, 5000);
    try {
      const result = await promise;
      log(`✓ ${name} (${((performance.now() - started) / 1000).toFixed(2)} s)`, "ok");
      return result;
    } catch (e) {
      log(`✗ ${name} failed: ${e && e.name}: ${e && e.message}`, "err");
      throw e;
    } finally {
      clearInterval(timer);
    }
  }

  log(`browser: ${navigator.userAgent}`);
  log(`secure page: ${window.isSecureContext}`);

  let session = null;
  let frames = 0;

  async function check() {
    if (!navigator.xr) {
      log("navigator.xr missing: this browser has no WebXR (or the page isn't secure)", "err");
      status("No WebXR in this browser", "err");
      return;
    }
    try {
      const ok = await step("isSessionSupported('immersive-vr')", navigator.xr.isSessionSupported("immersive-vr"));
      log(`  → ${ok}`, ok ? "ok" : "err");
      if (ok) {
        startBtn.disabled = false;
        status("Ready: put Link on, then Start XR");
      } else {
        status("No headset found: turn on Link, then Reload page", "err");
      }
    } catch {
      status("Couldn't check for a headset", "err");
    }
  }

  /** projection = true draws through an XRProjectionLayer (WebXR Layers API), which is what three.js picks when available. */
  async function start(projection) {
    startBtn.disabled = true;
    status("Starting…", "wait");
    log(`mode: ${projection ? "projection layer (XRWebGLBinding.createProjectionLayer)" : "classic XRWebGLLayer"}`);
    try {
      const canvas = document.createElement("canvas");
      const gl = canvas.getContext("webgl2", { xrCompatible: true, antialias: false }) ||
                 canvas.getContext("webgl", { xrCompatible: true, antialias: false });
      if (!gl) throw new Error("no WebGL context");
      log(`WebGL: ${gl instanceof WebGL2RenderingContext ? "2" : "1"}`);
      const dbg = gl.getExtension("WEBGL_debug_renderer_info");
      if (dbg) log(`GPU: ${gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)}`);

      session = await step("requestSession('immersive-vr')", navigator.xr.requestSession("immersive-vr"));
      log(`  visibilityState: ${session.visibilityState}`);
      session.addEventListener("visibilitychange", () => log(`visibilityState → ${session.visibilityState} (after ${frames} frames)`));
      session.addEventListener("end", () => {
        log(`session ended after ${frames} frames`, frames ? "ok" : "err");
        status(frames ? `Ended after ${frames} frames` : "Ended with 0 frames: the browser never asked for one", frames ? "" : "err");
        session = null;
        endBtn.hidden = true;
        startBtn.disabled = false;
      });
      endBtn.hidden = false;

      await step("makeXRCompatible()", gl.makeXRCompatible());
      let binding = null, projLayer = null, fb = null;
      if (projection) {
        if (typeof XRWebGLBinding === "undefined" || !("createProjectionLayer" in XRWebGLBinding.prototype)) {
          throw new Error("this browser has no WebXR Layers API (XRWebGLBinding.createProjectionLayer)");
        }
        binding = new XRWebGLBinding(session, gl);
        projLayer = binding.createProjectionLayer({ colorFormat: gl.RGBA8, scaleFactor: 1 });
        log(`XRProjectionLayer: ${projLayer.textureWidth}×${projLayer.textureHeight}, textureArrayLength ${projLayer.textureArrayLength}`);
        fb = gl.createFramebuffer();
        await step("updateRenderState(layers)", session.updateRenderState({ layers: [projLayer] }));
      } else {
        const layer = new XRWebGLLayer(session, gl);
        log(`XRWebGLLayer: ${layer.framebufferWidth}×${layer.framebufferHeight}`);
        await step("updateRenderState(baseLayer)", session.updateRenderState({ baseLayer: layer }));
      }

      let space;
      try {
        space = await step("requestReferenceSpace('local')", session.requestReferenceSpace("local"));
      } catch {
        space = await step("requestReferenceSpace('viewer')", session.requestReferenceSpace("viewer"));
      }

      frames = 0;
      let firstFrameAt = 0, lastReport = performance.now(), framesAtReport = 0;
      window.__frames = () => frames;
      const requestedAt = performance.now();
      log("→ waiting for the first XR frame (session.requestAnimationFrame)…");
      status("Waiting for the first frame…", "wait");
      const firstFrameTimer = setInterval(() => {
        if (frames) return clearInterval(firstFrameTimer);
        const s = Math.round((performance.now() - requestedAt) / 1000);
        log(`  still no frame (${s} s) · visibilityState: ${session && session.visibilityState}`, "wait");
        status(`In VR but 0 frames after ${s} s: the browser isn't asking for frames`, "wait");
      }, 5000);

      const onFrame = (time, frame) => {
        if (!session) return;
        session.requestAnimationFrame(onFrame);
        frames++;
        const now = performance.now();
        if (frames === 1) {
          firstFrameAt = now;
          clearInterval(firstFrameTimer);
          log(`✓ first XR frame after ${((now - requestedAt) / 1000).toFixed(2)} s`, "ok");
        }
        if (now - lastReport >= 1000) {
          const fps = ((frames - framesAtReport) * 1000) / (now - lastReport);
          status(`Streaming: ${frames} frames · ${fps.toFixed(0)} fps · ${session.visibilityState}`, "ok");
          lastReport = now;
          framesAtReport = frames;
        }
        // Solid colour that cycles through hues every 6 s; both eyes get the same.
        const pose = frame.getViewerPose(space);
        const hue = (time / 6000) % 1;
        const [r, g, b] = hsl(hue, 0.6, 0.45);
        gl.clearColor(r, g, b, 1);
        if (projLayer) {
          // One colour texture per eye (or one array texture): clear each view's sub-image.
          if (pose) {
            gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
            for (const view of pose.views) {
              const sub = binding.getViewSubImage(projLayer, view);
              if (sub.imageIndex) {
                gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, sub.colorTexture, 0, sub.imageIndex);
              } else {
                gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, sub.colorTexture, 0);
              }
              gl.clear(gl.COLOR_BUFFER_BIT);
            }
            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          }
        } else {
          gl.bindFramebuffer(gl.FRAMEBUFFER, session.renderState.baseLayer.framebuffer);
          gl.clear(gl.COLOR_BUFFER_BIT);
        }
        if (!pose && frames % 72 === 1) log("  (no viewer pose this frame: tracking not ready)", "wait");
      };
      session.requestAnimationFrame(onFrame);
    } catch (e) {
      status(`Failed: ${e && e.message}`, "err");
      if (!session) startBtn.disabled = false;
    }
  }

  function hsl(h, s, l) {
    const k = (n) => (n + h * 12) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    return [f(0), f(8), f(4)];
  }

  $("start").addEventListener("click", () => start(false));
  $("startProj").addEventListener("click", () => start(true));
  log(`WebXR Layers API (what three.js uses when present): ${typeof XRWebGLBinding !== "undefined" && "createProjectionLayer" in XRWebGLBinding.prototype}`);
  endBtn.addEventListener("click", () => session && session.end());
  $("reload").addEventListener("click", () => location.reload());
  check();
</script>
</body>
</html>
